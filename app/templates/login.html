
{% extends "base.html" %}

{% block title %}Đăng nhập - BookStore{% endblock %}

{% block content %}

<section class="login-section">
    <div class="login-container">

        <div class="login-header">
            <h1>Đăng nhập</h1>
            <p>Đăng nhập vào tài khoản BookStore của bạn.</p>
        </div>

        <form
            class="login-form"
            id="loginForm"
            action="{{ url_for('login') }}"
            method="POST"
        >
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="login-options">
                <label for="remember">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >
                    Ghi nhớ đăng nhập
                </label>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Đăng nhập
            </button>

            <div
                id="login-message"
                class="login-message"
                role="status"
                aria-live="polite"
            ></div>
        </form>

        <div class="register-link">
            <p>
                Chưa có tài khoản?
                <a href="{{ url_for('register_page') }}">
                    Đăng ký
                </a>
            </p>
        </div>

    </div>
</section>

{% endblock %}
