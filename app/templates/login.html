{% extends "base.html" %}

{% block title %}Đăng nhập - BookStore{% endblock %}

{% block content %}

<section class="login-section">

    <div class="login-container">

        <div class="login-header">

            <h1>Đăng nhập</h1>

            <p>
                Đăng nhập vào tài khoản BookStore của bạn.
            </p>

        </div>


        <form
            class="login-form"
            id="loginForm"
            action="{{ url_for('login') }}"
            method="POST"
        >

            <!-- TÊN ĐĂNG NHẬP -->
            <div class="form-group">

                <label for="username">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- MẬT KHẨU -->
            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- GHI NHỚ ĐĂNG NHẬP -->
            <div class="login-options">

                <label>

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Ghi nhớ đăng nhập

                </label>

            </div>


            <!-- NÚT ĐĂNG NHẬP -->
            <button
                type="submit"
                class="login-button"
            >
                Đăng nhập
            </button>


            <!-- THÔNG BÁO -->
            <div
                id="login-message"
                class="login-message"
            ></div>

        </form>


        <!-- ĐĂNG KÝ -->
        <div class="register-link">

            <p>
                Chưa có tài khoản?
                <a href="#">
                    Đăng ký
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
